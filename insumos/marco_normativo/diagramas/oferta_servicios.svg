</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="430" fill="#fff"/><text class="th" x="40" y="30">Su punto de partida</text><g class="c-purple"><rect x="40" y="40" width="600" height="50" rx="6" stroke-width="1"/><text class="th" x="340.0" y="59" text-anchor="middle" dominant-baseline="central">Su plan de desarrollo 2024-2027</text><text class="ts" x="340.0" y="76" text-anchor="middle" dominant-baseline="central">El PDF aprobado y los datos oficiales del DNP</text></g><line x1="150" y1="92" x2="150" y2="130" class="arr" marker-end="url(#a)"/><line x1="305" y1="92" x2="305" y2="130" class="arr" marker-end="url(#a)"/><line x1="460" y1="92" x2="460" y2="130" class="arr" marker-end="url(#a)"/><line x1="615" y1="92" x2="615" y2="130" class="arr" marker-end="url(#a)"/><text class="th" x="40" y="122">Lo que hacemos</text><g class="c-teal"><rect x="40" y="132" width="135" height="56" rx="6" stroke-width="0.5"/><text class="th" x="107.5" y="151" text-anchor="middle" dominant-baseline="central">Estructuramos</text><text class="ts" x="107.5" y="174" text-anchor="middle" dominant-baseline="central">Su plan en datos</text></g><g class="c-teal"><rect x="195" y="132" width="135" height="56" rx="6" stroke-width="0.5"/><text class="th" x="262.5" y="151" text-anchor="middle" dominant-baseline="central">Asignamos</text><text class="ts" x="262.5" y="174" text-anchor="middle" dominant-baseline="central">Sus secretarías reales</text></g><g class="c-teal"><rect x="350" y="132" width="135" height="56" rx="6" stroke-width="0.5"/><text class="th" x="417.5" y="151" text-anchor="middle" dominant-baseline="central">Exponemos</text><text class="ts" x="417.5" y="174" text-anchor="middle" dominant-baseline="central">Portal público</text></g><g class="c-gray"><rect x="505" y="132" width="135" height="56" rx="6" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="572.5" y="151" text-anchor="middle" dominant-baseline="central">Seguimiento</text><text class="ts" x="572.5" y="174" text-anchor="middle" dominant-baseline="central">Proyectos y avance</text></g><line x1="150" y1="190" x2="150" y2="228" class="arr" marker-end="url(#a)"/><line x1="300" y1="190" x2="300" y2="228" class="arr" marker-end="url(#a)"/><line x1="460" y1="190" x2="460" y2="228" class="arr" marker-end="url(#a)"/><line x1="615" y1="190" x2="615" y2="228" class="arr" marker-end="url(#a)"/><text class="th" x="40" y="220">Resultado</text><g class="c-purple"><rect x="40" y="230" width="186" height="56" rx="6" stroke-width="0.5"/><text class="th" x="133.0" y="249" text-anchor="middle" dominant-baseline="central">Plan claro</text><text class="ts" x="133.0" y="272" text-anchor="middle" dominant-baseline="central">Todo el plan, ordenado</text></g><g class="c-purple"><rect x="247" y="230" width="186" height="56" rx="6" stroke-width="0.5"/><text class="th" x="340.0" y="249" text-anchor="middle" dominant-baseline="central">Responsables claros</text><text class="ts" x="340.0" y="272" text-anchor="middle" dominant-baseline="central">Cada secretaría, su parte</text></g><g class="c-purple"><rect x="454" y="230" width="186" height="56" rx="6" stroke-width="0.5"/><text class="th" x="547.0" y="249" text-anchor="middle" dominant-baseline="central">Ciudadanía informada</text><text class="ts" x="547.0" y="272" text-anchor="middle" dominant-baseline="central">Avance visible y abierto</text></g><text class="th" x="40" y="322">Cómo arrancamos</text><g class="c-gray"><rect x="40" y="332" width="600" height="50" rx="6" stroke-width="0.5"/><text class="th" x="340.0" y="351" text-anchor="middle" dominant-baseline="central">Piloto en un municipio, luego se amplía</text><text class="ts" x="340.0" y="368" text-anchor="middle" dominant-baseline="central">Se valida el modelo antes de escalar</text></g><g class="c-teal"><rect x="40" y="404" width="14" height="14" rx="3" stroke-width=".5"/></g><text class="ts" x="60" y="412" dominant-baseline="central">Fase 1</text><g class="c-gray"><rect x="130" y="404" width="14" height="14" rx="3" stroke-width=".5" stroke-dasharray="3 2"/></g><text class="ts" x="150" y="412" dominant-baseline="central">Fase 2</text><g class="c-purple"><rect x="230" y="404" width="14" height="14" rx="3" stroke-width=".5"/></g><text class="ts" x="250" y="412" dominant-baseline="central">Lo que aporta y recibe el cliente</text></svg>