</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="610" fill="#fff"/><text class="th" x="40" y="30">1. Fuentes</text><g class="c-purple"><rect x="40" y="40" width="135" height="50" rx="6" stroke-width="0.5"/><text class="th" x="107.5" y="59" text-anchor="middle" dominant-baseline="central">SisPT</text><text class="ts" x="107.5" y="76" text-anchor="middle" dominant-baseline="central">Excel por entidad</text></g><g class="c-purple"><rect x="195" y="40" width="135" height="50" rx="6" stroke-width="0.5"/><text class="th" x="262.5" y="59" text-anchor="middle" dominant-baseline="central">Catálogo MGA</text><text class="ts" x="262.5" y="76" text-anchor="middle" dominant-baseline="central">Sector a indicador</text></g><g class="c-purple"><rect x="350" y="40" width="135" height="50" rx="6" stroke-width="0.5"/><text class="th" x="417.5" y="59" text-anchor="middle" dominant-baseline="central">PDF del plan</text><text class="ts" x="417.5" y="76" text-anchor="middle" dominant-baseline="central">Texto y tablas</text></g><g class="c-purple"><rect x="505" y="40" width="135" height="50" rx="6" stroke-width="0.5"/><text class="th" x="572.5" y="59" text-anchor="middle" dominant-baseline="central">Sitio alcaldía</text><text class="ts" x="572.5" y="76" text-anchor="middle" dominant-baseline="central">Secretarías reales</text></g><line x1="150" y1="92" x2="150" y2="130" class="arr" marker-end="url(#a)"/><line x1="305" y1="92" x2="305" y2="130" class="arr" marker-end="url(#a)"/><line x1="460" y1="92" x2="460" y2="130" class="arr" marker-end="url(#a)"/><line x1="615" y1="92" x2="615" y2="130" class="arr" marker-end="url(#a)"/><text class="th" x="40" y="122">2. Ingesta</text><g class="c-teal"><rect x="40" y="132" width="135" height="50" rx="6" stroke-width="0.5"/><text class="th" x="107.5" y="151" text-anchor="middle" dominant-baseline="central">Consolidar</text><text class="ts" x="107.5" y="168" text-anchor="middle" dominant-baseline="central">26.507 productos</text></g><g class="c-teal"><rect x="195" y="132" width="135" height="50" rx="6" stroke-width="0.5"/><text class="th" x="262.5" y="151" text-anchor="middle" dominant-baseline="central">Cruce</text><text class="ts" x="262.5" y="168" text-anchor="middle" dominant-baseline="central">Código y texto</text></g><g class="c-teal"><rect x="350" y="132" width="135" height="50" rx="6" stroke-width="0.5"/><text class="th" x="417.5" y="151" text-anchor="middle" dominant-baseline="central">Extractor PDF</text><text class="ts" x="417.5" y="168" text-anchor="middle" dominant-baseline="central">Responsable y base</text></g><g class="c-teal"><rect x="505" y="132" width="135" height="50" rx="6" stroke-width="0.5"/><text class="th" x="572.5" y="151" text-anchor="middle" dominant-baseline="central">Dependencias</text><text class="ts" x="572.5" y="168" text-anchor="middle" dominant-baseline="central">Una lista por alcaldía</text></g><line x1="150" y1="184" x2="150" y2="222" class="arr" marker-end="url(#a)"/><line x1="305" y1="184" x2="305" y2="222" class="arr" marker-end="url(#a)"/><line x1="460" y1="184" x2="460" y2="222" class="arr" marker-end="url(#a)"/><line x1="615" y1="184" x2="615" y2="222" class="arr" marker-end="url(#a)"/><text class="th" x="40" y="214">3. Base única</text><g class="c-teal"><rect x="40" y="224" width="600" height="50" rx="6" stroke-width="1"/><text class="th" x="340.0" y="243" text-anchor="middle" dominant-baseline="central">Base por entidad (contrato plan_base)</text><text class="ts" x="340.0" y="260" text-anchor="middle" dominant-baseline="central">Líneas, productos, indicadores, metas, responsables N a N, fuente y confianza</text></g><line x1="185" y1="276" x2="185" y2="314" class="arr" marker-end="url(#a)"/><line x1="495" y1="276" x2="495" y2="314" class="arr" marker-end="url(#a)"/><text class="th" x="40" y="306">4. Control</text><g class="c-teal"><rect x="40" y="316" width="290" height="50" rx="6" stroke-width="0.5"/><text class="th" x="185.0" y="335" text-anchor="middle" dominant-baseline="central">Reglas de calidad</text><text class="ts" x="185.0" y="352" text-anchor="middle" dominant-baseline="central">Marco normativo, lista de chequeo</text></g><g class="c-teal"><rect x="350" y="316" width="290" height="50" rx="6" stroke-width="0.5"/><text class="th" x="495.0" y="335" text-anchor="middle" dominant-baseline="central">Revisión humana</text><text class="ts" x="495.0" y="352" text-anchor="middle" dominant-baseline="central">Muestra y discrepancias</text></g><line x1="140" y1="368" x2="140" y2="406" class="arr" marker-end="url(#a)"/><line x1="300" y1="368" x2="300" y2="406" class="arr" marker-end="url(#a)"/><line x1="400" y1="368" x2="400" y2="406" class="arr" marker-end="url(#a)"/><line x1="540" y1="368" x2="540" y2="406" class="arr" marker-end="url(#a)"/><text class="th" x="40" y="398">5. Exposición</text><g class="c-teal"><rect x="40" y="408" width="186" height="50" rx="6" stroke-width="0.5"/><text class="th" x="133.0" y="427" text-anchor="middle" dominant-baseline="central">Ficha de entidad</text><text class="ts" x="133.0" y="444" text-anchor="middle" dominant-baseline="central">Plan, líneas, sectores</text></g><g class="c-teal"><rect x="247" y="408" width="186" height="50" rx="6" stroke-width="0.5"/><text class="th" x="340.0" y="427" text-anchor="middle" dominant-baseline="central">Árbol del plan</text><text class="ts" x="340.0" y="444" text-anchor="middle" dominant-baseline="central">De línea a indicador</text></g><g class="c-teal"><rect x="454" y="408" width="186" height="50" rx="6" stroke-width="0.5"/><text class="th" x="547.0" y="427" text-anchor="middle" dominant-baseline="central">Por dependencia</text><text class="ts" x="547.0" y="444" text-anchor="middle" dominant-baseline="central">Secretarías reales</text></g><line x1="133" y1="460" x2="133" y2="498" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/><line x1="340" y1="460" x2="340" y2="498" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/><line x1="547" y1="460" x2="547" y2="498" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/><text class="th" x="40" y="490">6. Después</text><g class="c-gray"><rect x="40" y="500" width="186" height="50" rx="6" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="133.0" y="519" text-anchor="middle" dominant-baseline="central">Proyectos</text><text class="ts" x="133.0" y="536" text-anchor="middle" dominant-baseline="central">Vínculo a productos</text></g><g class="c-gray"><rect x="247" y="500" width="186" height="50" rx="6" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="340.0" y="519" text-anchor="middle" dominant-baseline="central">Avance y montos</text><text class="ts" x="340.0" y="536" text-anchor="middle" dominant-baseline="central">Alcaldías e internos</text></g><g class="c-gray"><rect x="454" y="500" width="186" height="50" rx="6" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="547.0" y="519" text-anchor="middle" dominant-baseline="central">Ciudadanía</text><text class="ts" x="547.0" y="536" text-anchor="middle" dominant-baseline="central">Seguimiento y comentarios</text></g><g class="c-purple"><rect x="40" y="578" width="14" height="14" rx="3" stroke-width=".5"/></g><text class="ts" x="60" y="586" dominant-baseline="central">Fuente externa</text><g class="c-teal"><rect x="190" y="578" width="14" height="14" rx="3" stroke-width=".5"/></g><text class="ts" x="210" y="586" dominant-baseline="central">Lo que construimos ahora</text><g class="c-gray"><rect x="400" y="578" width="14" height="14" rx="3" stroke-width=".5" stroke-dasharray="3 2"/></g><text class="ts" x="420" y="586" dominant-baseline="central">Reservado para después</text></svg>