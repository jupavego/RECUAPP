<div class="auth-layout">

  <!-- ── Panel lateral de marca ───────────────────────────────────────────── -->
  <aside class="auth-sidebar">

    <!-- Burbujas decorativas de fondo -->
    <div class="auth-sidebar__deco" aria-hidden="true">
      <div class="auth-sidebar__bubble auth-sidebar__bubble--1"></div>
      <div class="auth-sidebar__bubble auth-sidebar__bubble--2"></div>
      <div class="auth-sidebar__bubble auth-sidebar__bubble--3"></div>
    </div>

    <!-- Logo + nombre -->
    <div class="auth-sidebar__top">
      <div class="auth-sidebar__logo-wrap">
        <!-- Ícono de marca: la hoja del menú principal -->
        <i class="auth-sidebar__logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4C9 4 4 9.5 4 15c0 1.7.5 3 1.2 4C6 14 10 10.5 15 9c-4 2.5-7 6-8 11 1 .6 2.2 1 3.5 1C17 21 20 13 20 4z"/></svg>
        </i>
        <span class="auth-sidebar__name">{{ site.name }}</span>
      </div>
      <span class="auth-sidebar__edicion">{{ site.tagline }}</span>
    </div>

    <!-- Mensaje central -->
    <div class="auth-sidebar__mensaje">
      <h2 class="auth-sidebar__titular">Recorre Girardota y mira <em>cómo avanza su plan</em>.</h2>
      <p class="auth-sidebar__texto">Explora el mapa 3D y consulta quién responde por cada producto.</p>

      <dl class="auth-sidebar__cifras">
        <div><dt>244</dt><dd>productos</dd></div>
        <div><dt>49</dt><dd>programas</dd></div>
        <div><dt>15</dt><dd>dependencias</dd></div>
      </dl>
    </div>

    <!-- Footer con link de regreso -->
    <div class="auth-sidebar__footer">
      <a routerLink="/" class="auth-sidebar__back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Volver al inicio
      </a>
    </div>

  </aside>

  <!-- ── Área de formulario ────────────────────────────────────────────────── -->
  <main class="auth-content">
    <router-outlet />
  </main>

</div>
